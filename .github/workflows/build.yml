name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk karoo-pantallas.apk
      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: karoo-pantallas
          path: karoo-pantallas.apk
      - name: Publicar release (enlace fijo para el Karoo)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          make_latest: true
          files: |
            karoo-pantallas.apk
            app/manifest.json
